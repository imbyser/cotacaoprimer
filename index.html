<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPBH_zOO3xrdiyW1qk20b3b1ejMlyYSvg",
      authDomain: "supercotacao-6a43c.firebaseapp.com",
      projectId: "supercotacao-6a43c",
      storageBucket: "supercotacao-6a43c.firebasestorage.app",
      messagingSenderId: "360323319589",
      appId: "1:360323319589:web:b09f3744f1b9a92f11bccc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isLoginMode = true;
    const clientesCompletos = ["thiago.limaflp@hotmail.com"];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('userEmailDisplay').innerText = user.email;
        document.getElementById('appContainer').style.display = 'block';
        document.getElementById('userBar').style.display = 'flex';
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('c')) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('appContainer').style.display = 'block';
        } else {
          document.getElementById('authOverlay').style.display = 'flex';
          document.getElementById('appContainer').style.display = 'none';
        }
      }
    });

    window.processarAuth = async function() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!email || !password) return alert("Preencha e-mail e senha.");
      try {
        if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
        else await createUserWithEmailAndPassword(auth, email, password);
      } catch (error) { alert("Falha na autenticação."); }
    };

    window.alternarModoAuth = function() {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? "Acessar Sistema" : "Criar Conta";
      document.getElementById('btnAuthSubmit').innerText = isLoginMode ? "Entrar" : "Cadastrar";
    };

    window.fazerLogout = function() { signOut(auth); };

    window.salvarCotacaoEGerarLink = async function() {
      const cotacaoId = "COT-" + Math.floor(100000 + Math.random() * 900000);
      const cliente = document.getElementById('nomeCliente').value.trim() || 'Mercadinho';
      const tel = document.getElementById('telCliente').value.trim();
      const prazo = document.getElementById('prazoPagamento').value;
      const pagto = document.getElementById('formaPagamento').value;
      const tipo = document.getElementById('tipoCotacao').value;

      const cards = document.querySelectorAll('.produto-card');
      let produtos = [];

      cards.forEach((card, index) => {
        const nome = card.querySelector('.input-nome').value.trim();
        const emb = card.querySelector('.input-embalagem').value.trim();
        if (nome !== "") produtos.push({ id: index, nome, emb });
      });

      if (produtos.length === 0) return alert("Adicione pelo menos um produto!");

      try {
        await setDoc(doc(db, "cotacoes", cotacaoId), {
          cliente, tel, prazo, pagto, tipo, produtos, ofertas: {}
        });

        cotacaoIdAtual = cotacaoId;
        window.history.pushState({}, '', `?c=${cotacaoId}&e=1`); 
        window.carregarCotacaoDoBanco(cotacaoId, 1);

        const baseUrl = window.location.href.split('?')[0];
        const linkVendedor = `${baseUrl}?c=${cotacaoId}&e=2`;

        let msg = `🛒 *SOLICITAÇÃO DE COTAÇÃO*\nCliente: *${cliente}*\nModalidade: *${tipo}*\n\nPreencha seus preços no link:\n${linkVendedor}`;

        alert(`✅ Cotação Criada!\nAgora clique na Aba "3. Pedido" para ver os preços chegarem ao vivo!`);
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
      } catch (e) {
        alert("Erro ao criar: " + e.message);
      }
    };

    window.salvarPrecosVendedor = async function(cotacaoId) {
      const vendedor = document.getElementById('nomeVendedor').value.trim();
      const empresa = document.getElementById('empresaVendedor').value.trim();
      const nomeIdentificacao = empresa ? `${vendedor} (${empresa})` : vendedor;

      if (!vendedor) return alert("Preencha o seu nome!");

      const cards = document.querySelectorAll('.produto-card');
      let precos = {};
      let preenchidos = 0;

      cards.forEach((card) => {
        const inputNome = card.querySelector('.input-nome');
        const inputPreco = card.querySelector('.input-preco');
        const nome = inputNome ? inputNome.value.trim() : '';
        const precoStr = inputPreco ? inputPreco.value.replace(',', '.') : '';
        const preco = parseFloat(precoStr);

        if (nome !== "" && !isNaN(preco) && preco > 0) {
          precos[nome] = preco;
          preenchidos++;
        }
      });

      if (preenchidos === 0) return alert("⚠️ Digite o preço de pelo menos um produto! (Ex: 15,50)");

      try {
        const docRef = doc(db, "cotacoes", cotacaoId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          let ofertasAtuais = docSnap.data().ofertas || {};
          ofertasAtuais[nomeIdentificacao] = precos;
          await updateDoc(docRef, { ofertas: ofertasAtuais });
          alert("✅ Seus preços foram enviados com sucesso ao cliente!");
        }
      } catch (error) {
        alert("❌ Erro ao enviar preços.");
      }
    };

    window.carregarCotacaoDoBanco = async function(cotacaoId, etapa) {
      const docRef = doc(db, "cotacoes", cotacaoId);

      const montarTela = (data) => {
        document.getElementById('nomeCliente').value = data.cliente || '';
        document.getElementById('telCliente').value = data.tel || '';
        
        document.getElementById('listaProdutos').innerHTML = '';
        const ofertas = data.ofertas || {};

        data.produtos.forEach(prod => {
          let menorPreco = 0;
          let vencedor = 'Pendente';

          for (let vend in ofertas) {
            const precoVendedor = parseFloat(ofertas[vend][prod.nome]);
            if (precoVendedor > 0) {
              if (menorPreco === 0 || precoVendedor < menorPreco) {
                menorPreco = precoVendedor;
                vencedor = vend;
              }
            }
          }
          // Deixa o campo vazio se não for a aba do cliente, assim o placeholder funciona e não apaga o que o vendedor digitou
          const precoExibicao = (etapa === 3) ? menorPreco : '';
          adicionarNovoProduto(prod.nome, prod.emb, precoExibicao, 1, vencedor, false);
        });

        alternarEtapa(etapa);
        if (etapa === 3) calcularTotalEGerarSplits();
      };

      if (etapa === 2) {
        // VENDEDOR: Carrega do banco apenas uma vez (getDoc). Isso impede que a tela dele "pisque" e apague os números quando ele clicar em salvar.
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          montarTela(docSnap.data());
        }
      } else {
        // CLIENTE: Fica conectado na antena ao vivo (onSnapshot).
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            montarTela(docSnap.data());
          }
        });
      }
    };
  </script>
